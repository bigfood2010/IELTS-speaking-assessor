name: Ping Supabase

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel app
        run: |
          status=$(curl -I -s -o /dev/null -w "%{http_code}" https://ielts-speaking-studio-one.vercel.app/)
          echo "HTTP Status: $status"
          if [ "$status" = "200" ]; then
            echo "App is healthy"
          else
            echo "App returned status: $status"
            exit 1
          fi
